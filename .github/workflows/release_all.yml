name: Build and Release All Kernels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 设备列表 - 目前只编译以下设备
        device: [elish, enuma, dagu, pipa]
        
        # 配置矩阵：ksu类型和susfs是否启用
        ksu_config: [
          {type: "none"},
          {type: "ksu", susfs: true},
          {type: "rksu", susfs: false}
        ]

    name: Build ${{ matrix.device }} ${{ matrix.ksu_config.type }} ${{ matrix.ksu_config.susfs != null && (matrix.ksu_config.susfs && 'SUSFS' || 'NoSUSFS') || '' }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Cache (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache_mikernel
          # 统一使用 global 标识，通过 run_id 保证每次运行能上传新缓存
          key: kernel-ccache-global-${{ github.run_id }}
          # 优先级：先找 global，再尝试找任何相关的
          restore-keys: |
            kernel-ccache-global-
            kernel-ccache-

      - name: Setup Toolchain (ZyC-Clang 22)
        run: |
          mkdir -p $HOME/ZyC-clang
          cd $HOME/ZyC-clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250924-release/Clang-22.0.0git-20250924.tar.gz
          tar -zxvf Clang-22.0.0git-20250924.tar.gz

      - name: Modify SUSFS_ENABLE in build.sh (KSU/RKSU only)
        # 对于KSU/RKSU版本，根据配置修改build.sh中的SUSFS_ENABLE设置
        run: |
          if [ "${{ matrix.ksu_config.type }}" != "none" ]; then
            if [ "${{ matrix.ksu_config.susfs }}" = "false" ]; then
              # 将SUSFS_ENABLE=1替换为SUSFS_ENABLE=0
              sed -i 's/SUSFS_ENABLE=1/SUSFS_ENABLE=0/g' build.sh
              echo "SUSFS_ENABLE set to 0"
            else
              # 确保SUSFS_ENABLE设置为1（虽然默认就是1）
              sed -i 's/SUSFS_ENABLE=0/SUSFS_ENABLE=1/g' build.sh
              echo "SUSFS_ENABLE set to 1"
            fi
            
            # 显示修改后的设置确认
            echo "Current SUSFS_ENABLE setting in build.sh:"
            grep "SUSFS_ENABLE=" build.sh
          else
            echo "No KSU version, skipping SUSFS_ENABLE modification"
          fi

      - name: Run Build Script
        run: |
          chmod +x build.sh
          if [ "${{ matrix.ksu_config.type }}" = "none" ]; then
            # 不启用KSU的版本
            bash build.sh ${{ matrix.device }}
          elif [ "${{ matrix.ksu_config.type }}" = "ksu" ]; then
            # 启用KSU的版本
            bash build.sh ${{ matrix.device }} ksu
          else
            # 启用RKSU的版本
            bash build.sh ${{ matrix.device }} rksu
          fi

      - name: Rename Artifacts
        # 重命名生成的文件以便区分不同配置
        run: |
          # 获取生成的zip文件
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              # 解析原始文件名，替换KSU_ZIP_STR部分，添加SUSFS状态
              if [ "${{ matrix.ksu_config.type }}" = "ksu" ]; then
                # if [ "${{ matrix.ksu_config.susfs }}" = "true" ]; then
                  # SukiSU -> SukiSU-SUSFS
                  newname=$(echo "$zipfile" | sed 's/_SukiSU_/_SukiSU-SUSFS_/g')
                # else
                  # SukiSU -> SukiSU-NoSUSFS
                  # newname=$(echo "$zipfile" | sed 's/_SukiSU_/_SukiSU-NoSUSFS_/g')
                # fi
              # elif [ "${{ matrix.ksu_config.type }}" = "rksu" ]; then
                # if [ "${{ matrix.ksu_config.susfs }}" = "true" ]; then
                  # RKSU -> RKSU-SUSFS
                  # newname=$(echo "$zipfile" | sed 's/_RKSU_/_RKSU-SUSFS_/g')
                # else
                  # RKSU -> RKSU-NoSUSFS
                  # newname=$(echo "$zipfile" | sed 's/_RKSU_/_RKSU-NoSUSFS_/g')
                # fi
              else
                # 无KSU版本，保持原样
                newname="$zipfile"
              fi
              
              # 重命名文件
              if [ "$newname" != "$zipfile" ]; then
                mv "$zipfile" "$newname"
                echo "Renamed: $zipfile -> $newname"
              fi
            fi
          done

      - name: Upload Local Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ matrix.device }}-${{ matrix.ksu_config.type }}${{ matrix.ksu_config.susfs != null && format('-{0}', matrix.ksu_config.susfs && 'SUSFS' || 'NoSUSFS') || '' }}
          path: ./*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_kernels
          pattern: Kernel-*
          merge-multiple: true

      - name: Prepare Release Info
        id: info
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "GIT_SHA=$(git rev-parse --short=8 HEAD)" >> $GITHUB_ENV
          echo "TAG_NAME=v$(date +'%Y%m%d')-$(git rev-parse --short=8 HEAD)" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "ApartTUSITU Kernel Build - ${{ env.BUILD_DATE }} (${{ env.GIT_SHA }})"
          body: |
            ## 自动构建内核发布 / Automated Kernel Release
            
            - **构建日期 / Build Date:** ${{ env.BUILD_DATE }}
            - **提交哈希 / Commit SHA:** `${{ env.GIT_SHA }}`
            - **包含设备 / Devices:** elish, enuma, dagu, pipa
            
            ---
            **版本说明 / Version Guide:**
            
            **KSU类型 / KSU Type:**
            - **NoKernelSU**: 不包含 KernelSU 和 SuSFS 补丁。
            - **SukiSU-SUSFS**: 已集成 ReSukiSU 和 SuSFS 补丁。
            - **RKSU**: 已集成 KernelSU legacy 未集成 SuSFS 补丁。
            
            **SUSFS功能 / SUSFS Feature (仅KSU/RKSU版本):**
            - **-SUSFS**: 启用SUSFS功能
            - **-NoSUSFS**: 禁用SUSFS功能
            
            **ROM兼容性 / ROM Compatibility:**
            - **MIUI**: 适用于小米官方或基于小米官方修改的 ROM。
            - **AOSP**: 适用于类原生 ROM (LineageOS, Pixel Experience 等)。
          files: all_kernels/*.zip
